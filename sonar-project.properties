# SonarQube Cloud 程式碼檢驗設定（https://sonarcloud.io/project/overview?id=hchunkai821_accountingsucks）
sonar.organization=hchunkai821
sonar.projectKey=hchunkai821_accountingsucks
sonar.projectName=accountingsucks
sonar.sources=.
sonar.exclusions=server/data/**,icons/**,**/*.png,**/node_modules/**,coverage/**
sonar.sourceEncoding=UTF-8
# 這幾個是跨檔案共用的全域變數（在 01-core.js、06-game.js、07-ui.js 宣告）
sonar.javascript.globals=S,rand,ui,confirmReset,AUTO,SETUP_DICE
# 測試覆蓋率：用平衡測試（自動模擬幾百段人生）量測，掃描前先執行：
#   npx c8@10.1.3 --reporter=lcovonly --include='js/**' node tools/simulate.js 30 && sed -i '' "s|^SF:$PWD/|SF:|" coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=tools/**
